<article class="tarjeta{{clase}}">
  <img class="tarjeta__img" src="{{imagen}}" alt="" width="{{ancho}}" height="{{alto}}"{{{carga}}}>
  <div class="tarjeta__cuerpo">
    <p class="etiqueta">{{categoria}}</p>
    <h{{nivel}} class="tarjeta__titulo"><a href="{{url}}">{{titulo}}</a></h{{nivel}}>
    <p class="tarjeta__texto">{{descripcion}}</p>
    <p class="tarjeta__meta"><time datetime="{{fechaISO}}">{{fecha}}</time> · {{lectura}} min de lectura</p>
  </div>
</article>
